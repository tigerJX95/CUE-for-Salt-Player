import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20'
}

def releasedVersion = '0.8.0'
version = providers.gradleProperty('previewVersion').getOrElse(releasedVersion)

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions.jvmTarget = JvmTarget.JVM_17
}

def workshopApi = 'com.github.Moriafly.spw-workshop-api:spw-workshop-api:0.1.0-dev22'
def pf4j = 'org.pf4j:pf4j:3.12.0'
def kotlinStdlib = 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'

dependencies {
    compileOnly 'org.jetbrains.compose.foundation:foundation-desktop:1.12.0'
    compileOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2'
    compileOnly workshopApi
    compileOnly pf4j
    compileOnly kotlinStdlib
    testImplementation 'androidx.compose.runtime:runtime-desktop:1.12.0'
    testRuntimeOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2'
    testImplementation workshopApi
    testImplementation pf4j
    testImplementation kotlinStdlib
    testImplementation 'junit:junit:4.13.2'
}

tasks.named('jar', Jar) {
    from('LICENSE') {
        into('META-INF')
    }
    manifest {
        attributes(
            'Plugin-Class': 'spw.cue.CuePlugin',
            'Plugin-Id': 'spw.cue.support',
            'Plugin-Version': project.version.toString(),
            'Plugin-Provider': 'CUE for Salt Player',
            'Plugin-Name': 'CUE for Salt Player',
            'Plugin-Description': 'External and FLAC-embedded CUE tracks in Salt Player albums and songs',
            'Plugin-Has-Config': 'true',
            'Plugin-Permissions': 'key-bindings,library-read,class-transform'
        )
    }
}

tasks.register('plugin', Zip) {
    group = 'build'
    description = 'Build the SPW workshop package'
    def mainJar = tasks.named('jar', Jar)
    dependsOn mainJar
    archiveFileName = "CUE_for_Salt_Player_v${project.version.toString().replace('-', '_')}.spmod"
    destinationDirectory = layout.buildDirectory.dir('libs')
    into('classes') {
        from { zipTree(mainJar.get().archiveFile.get().asFile) }
    }
}

// Test packages must pass the complete unit suite too.
tasks.named('plugin') { dependsOn tasks.named('test') }

tasks.named('test') {
    systemProperty 'cue.releasedVersion', releasedVersion
    inputs.files('docs/README.md', 'docs/README_EN.md', 'docs/CHANGELOG.md', 'docs/CHANGELOG_EN.md',
        '.github/ISSUE_TEMPLATE/问题反馈-bug-report.yml')
}

tasks.register('hostRegressionGate', Exec) {
    group = 'verification'
    description = 'Verify native bindings and real-host CUE row projection before release'
    dependsOn tasks.named('jar'), tasks.named('test')
    doFirst {
        def archive = providers.gradleProperty('spwHostArchive').orElse(providers.environmentVariable('SPW_HOST_ARCHIVE')).orNull
        if (!archive || !file(archive).isFile()) {
            throw new GradleException('Release requires the local Salt Player host archive: -PspwHostArchive=/path/to/ffmpeg-x64.dll (or SPW_HOST_ARCHIVE)')
        }
        commandLine new File(System.getProperty('java.home'), 'bin/java').absolutePath,
            '-Djava.awt.headless=true', file('scripts/HostRegressionGate.java').absolutePath,
            tasks.named('jar').get().archiveFile.get().asFile.absolutePath, file(archive).absolutePath
    }
}

tasks.named('plugin') { mustRunAfter tasks.named('hostRegressionGate') }

tasks.register('releasePlugin') {
    group = 'build'
    description = 'Build a release package only after unit and real-host regression gates pass'
    dependsOn tasks.named('hostRegressionGate'), tasks.named('plugin')
}
