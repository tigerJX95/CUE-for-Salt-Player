name: 问题反馈 / Bug Report
description: 反馈椒盐播放器 CUE 分轨插件的问题。 / Report a bug in CUE for Salt Player.
title: "[程序错误] "
labels: ["bug"]
assignees: ["tigerJX95"]
type: Bug

body:
  - type: checkboxes
    id: affected-platform
    attributes:
      label: 💻 受影响的平台与渠道 / Affected Platform and Channel
      description: |
        请至少选择一个已确认能复现问题的平台与渠道。

        Select at least one platform and channel where you reproduced the issue.
      options:
        - label: Windows · 微软商店 / Windows · Microsoft Store
        - label: Windows · Steam
        - label: Linux · Steam

  - type: input
    id: player-version
    attributes:
      label: 🎵 播放器版本 / Player Version
      description: |
        请填写椒盐播放器的版本，可在播放器的关于页面查看。

        Enter the Salt Player version shown on the About page.
      placeholder: 例如 / e.g. 1.19.3
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认 / Before You Submit
      options:
        - label: 我已查看项目说明，并搜索过已有议题。 / I have read the project documentation and searched existing issues.
          required: true
        - label: 此议题只反馈一个问题。 / I am reporting one issue in this submission.
          required: true

  - type: input
    id: plugin-version
    attributes:
      label: 📦 插件版本 / Plugin Version
      description: |
        请填写 CUE for Salt Player 的版本，可在椒盐的模组管理中查看。

        Enter the CUE for Salt Player version shown in Salt Player’s mod manager.
      placeholder: 例如 / e.g. v0.4.0
    validations:
      required: true

  - type: input
    id: system-version
    attributes:
      label: 🖥️ 操作系统版本 / OS Version
      placeholder: 例如 / e.g. Windows 10 22H2 / Ubuntu 26.04.1 LTS
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: 🐛 问题描述与实际表现 / Bug Description and Actual Behavior
      description: |
        请说明问题出现在专辑详情、「歌曲」页、分轨窗口还是播放过程中，以及当时的实际表现。

        Say whether the issue occurred in Album Details, Songs, the CUE window, or during playback, and describe what happened.
      placeholder: 例如 / e.g. 专辑详情能看到分轨，但点播跳到了错误的位置 / CUE tracks appear in Album Details, but selecting one seeks to the wrong position.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔄 复现步骤 / Steps to Reproduce
      description: |
        请按顺序列出操作。涉及分轨显示时，请注明「在歌曲页显示 CUE 分轨」和「识别 CUE 后隐藏整轨」的相关设置。偶发问题请注明出现频率。

        List the steps in order. For display issues, include the relevant Songs-page CUE display and original-track hiding settings. If the issue is intermittent, say how often it occurs.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: ✅ 预期表现 / Expected Behavior
      description: |
        请说明该操作在正常情况下应有的表现。

        Describe what you expected to happen.

  - type: textarea
    id: additional-context
    attributes:
      label: 📸 截图、日志或补充信息 / Screenshots, Logs, or Additional Context
      description: |
        可附截图、录屏或分轨窗口的诊断信息。如果问题与识别有关，请注明音频格式、外置或内嵌 CUE、单碟或多碟。必要时可附 CUE 中的 FILE 和 INDEX 行。上传前请移除个人信息和本地路径。

        Attach screenshots, a recording, or diagnostics from the CUE window. For recognition issues, include the audio format, whether the CUE is external or embedded, and whether the album spans multiple discs. Add the relevant FILE and INDEX lines if helpful. Remove personal information and local paths before uploading.
