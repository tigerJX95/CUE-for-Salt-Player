name: 自动标记 CUE 问题的平台与渠道

on:
  issues:
    types: [opened]
  push:
    paths: ['.github/workflows/auto-labeler.yml']

jobs:
  label-platform:
    if: github.event_name == 'issues' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 同步平台与渠道标签
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const microsoftStore = { name: 'Windows · Microsoft Store', color: '0366d6' };
            const steamWindows = { name: 'Windows · Steam', color: '7057ff' };
            const steamLinux = { name: 'Linux · Steam', color: '0e8a16' };
            const labelsByAnswer = new Map([
              ['Windows · 微软商店 / Windows · Microsoft Store', microsoftStore],
              ['Windows · Steam', steamWindows],
              ['Linux · Steam', steamLinux],
            ]);
            let labels = [...labelsByAnswer.values()];
            if (context.eventName === 'issues') {
              const body = (context.payload.issue.body ?? '').replace(/\r\n/g, '\n').trimStart();
              // 只读取第一个表单字段，兼容旧版下拉选项。
              const [heading, ...lines] = body.split('\n');
              if (heading.trim() !== '### 💻 受影响的平台与渠道 / Affected Platform and Channel') return;

              const nextField = lines.findIndex(line => line.startsWith('### '));
              const answer = (nextField === -1 ? lines : lines.slice(0, nextField)).join('\n').trim();
              const channels = /^- \[[ xX]\]/m.test(answer)
                ? [...answer.matchAll(/^- \[[xX]\][ \t]+(.+)$/gm)].map(match => match[1].trim())
                : answer.split(',').map(channel => channel.trim());
              labels = [...new Set(channels)].map(channel => labelsByAnswer.get(channel));
              if (!labels.length || labels.some(label => !label)) return;
            }

            const repository = context.repo;
            const issues = github.rest.issues;
            for (const label of labels) {
              const lookup = { ...repository, name: label.name };
              // 首次使用时创建标签。并行提交可能已创建同名标签。
              let existing;
              try {
                ({ data: existing } = await issues.getLabel(lookup));
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await issues.createLabel({ ...repository, ...label });
                  continue;
                } catch (creationError) {
                  if (creationError.status !== 422) throw creationError;
                  ({ data: existing } = await issues.getLabel(lookup));
                }
              }
              if (existing.color !== label.color) {
                await issues.updateLabel({ ...lookup, color: label.color });
              }
            }

            if (context.eventName !== 'issues') return;
            await issues.addLabels({
              ...repository,
              issue_number: context.issue.number,
              labels: labels.map(label => label.name),
            });
